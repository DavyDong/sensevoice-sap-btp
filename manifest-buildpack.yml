---
applications:
  - name: ((app_name))
    instances: 1
    memory: 6G
    disk_quota: 6G
    stack: cflinuxfs5
    buildpacks:
      - python_buildpack
    command: python scripts/download_models.py --verify && python run.py
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health/ready
    health-check-invocation-timeout: 5
    routes:
      - route: ((route))
    services:
      - ((xsuaa_service))
    env:
      HOST: 0.0.0.0
      AUTH_MODE: xsuaa
      # Optional ACCESS_TOKEN is configured in BTP User-Provided Variables, not stored here.
      XSUAA_SERVICE_NAME: ((xsuaa_service))
      TORCH_THREADS: "2"
      MODEL_ROOT: models
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
